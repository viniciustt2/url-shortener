services:
  app:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-url-shortener}
      REDIS_URL: redis://redis:6379
      COUNTER_REDIS_URL: redis://redis-counter:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-shortly}:${RABBITMQ_PASSWORD:-shortly-local-password}@rabbitmq:5672
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      TRUST_PROXY_HOPS: 1
      SHORT_CODE_SECRET: ${SHORT_CODE_SECRET:-shortly-local-development-secret-change-before-production}
    depends_on:
      mongo:
        condition: service_healthy
      redis-counter:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      BACKEND_API_URL: http://app:3000
      PORT: 3000
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-counter:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${COUNTER_REDIS_PORT:-6381}:6379"
    volumes:
      - redis_counter_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shortly}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shortly-local-password}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  mongo_data:
  redis_counter_data:
  rabbitmq_data:
